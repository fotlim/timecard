apply plugin: 'com.android.application'

// --- 版本号：唯一来源是 apps/mobile/package.json，避免和桌面端手改对不上 ---
// 0.1.3 → versionCode 103（主*10000 + 次*100 + 修订），保证单调递增（Android 不允许降级安装）
def mobilePkgJson = new File(project.projectDir, '../../package.json')
def mobileVersion = '0.1.0'
try {
    def parsed = new groovy.json.JsonSlurper().parseText(mobilePkgJson.getText('UTF-8'))
    if (parsed.version) mobileVersion = parsed.version.toString()
} catch (Throwable ignored) {
    logger.warn("读不到 apps/mobile/package.json，版本号回退为 ${mobileVersion}")
}
def versionParts = mobileVersion.tokenize('.').collect { (it.replaceAll(/[^0-9]/, '') ?: '0') as int }
while (versionParts.size() < 3) versionParts << 0
def computedVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// --- 签名：正式密钥放 android/key.properties（已 gitignore，绝不进仓库） ---
// 有密钥 → release 用正式签名；没密钥（新克隆/CI）→ 退化为 debug 签名，仍可安装自测
def keyPropsFile = new File(project.rootDir, 'key.properties')
def keyProps = new Properties()
def hasReleaseKey = keyPropsFile.exists()
if (hasReleaseKey) {
    keyPropsFile.withInputStream { keyProps.load(it) }
}

android {
    namespace "com.timecard.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.timecard.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName mobileVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 签名配置必须声明在 buildTypes 之前，否则 signingConfigs.release 还没注册就引用会报错
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile new File(keyProps.getProperty('storeFile'))
                storePassword keyProps.getProperty('storePassword')
                keyAlias keyProps.getProperty('keyAlias')
                keyPassword keyProps.getProperty('keyPassword')
                // v1 给 Android 6 及以下 / 部分安装器，v2 是 Android 11+ 的硬要求，v3 兼顾较新校验
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            // 真机自测也和正式包用同一把钥匙：debug/release 互相覆盖安装不会撞签名
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // 体积：release 走 R8 压缩 + 资源裁剪（debug 包 4.4 MB 里大头是 androidx/webview）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
