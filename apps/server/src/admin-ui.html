    <div class="toasts" id="toasts"></div>

    <script>
      "use strict";

      /* ============================================================
       * 小工具
       * ========================================================== */
      const $ = (sel, root) => (root || document).querySelector(sel);
      const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
      const LS_TOKEN = "timecard.console.token";
      const LS_THEME = "timecard.console.theme";

      const FISH_SVG =
        '<svg viewBox="0 0 40 28" aria-hidden="true">' +
        '<path d="M12 14 L2 5 L4.5 14 L2 23 Z" fill="currentColor"/>' +
        '<ellipse cx="23" cy="14" rx="13.5" ry="9.5" fill="currentColor"/>' +
        '<circle cx="29.5" cy="10.5" r="1.9" fill="var(--surface)"/>' +
        "</svg>";

      function esc(v) {
        return String(v == null ? "" : v).replace(/[&<>"']/g, function (m) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
        });
      }
      function safeColor(c) {
        return /^#[0-9a-fA-F]{3,8}$/.test(String(c || "")) ? c : "#71805a";
      }
      function pad2(n) {
        return String(n).padStart(2, "0");
      }
      function fmtBytes(n) {
        if (n == null || isNaN(n)) return "—";
        if (n < 1024) return n + " B";
        const u = ["KB", "MB", "GB", "TB"];
        let i = -1;
        do {
          n /= 1024;
          i += 1;
        } while (n >= 1024 && i < u.length - 1);
        return n.toFixed(n >= 100 ? 0 : 1) + " " + u[i];
      }
      function fmtDur(ms) {
        if (ms == null || isNaN(ms)) return "—";
        if (ms < 1000) return ms + " 毫秒";
        let s = Math.floor(ms / 1000);
        const d = Math.floor(s / 86400);
        s -= d * 86400;
        const h = Math.floor(s / 3600);
        s -= h * 3600;
        const m = Math.floor(s / 60);
        s -= m * 60;
        const out = [];
        if (d) out.push(d + " 天");
        if (h) out.push(h + " 小时");
        if (m && !d) out.push(m + " 分");
        if (!d && !h) out.push(s + " 秒");
        return out.join(" ");
      }
      function relTime(ts) {
        if (!ts) return "—";
        const s = Math.round((Date.now() - ts) / 1000);
        if (s <= 1) return "刚刚";
        if (s < 60) return s + " 秒前";
        const m = Math.round(s / 60);
        if (m < 60) return m + " 分钟前";
        const h = Math.round(m / 60);
        if (h < 24) return h + " 小时前";
        const d = Math.round(h / 24);
        if (d < 30) return d + " 天前";
        return new Date(ts).toLocaleDateString("zh-CN");
      }
      function fmtDateTime(ts) {
        if (ts == null) return "—";
        const d = new Date(ts);
        return (
          d.getFullYear() +
          "-" +
          pad2(d.getMonth() + 1) +
          "-" +
          pad2(d.getDate()) +
          " " +
          pad2(d.getHours()) +
          ":" +
          pad2(d.getMinutes())
        );
      }
      function shortId(id) {
        const s = String(id || "");
        return s.length > 13 ? s.slice(0, 8) + "…" + s.slice(-3) : s || "—";
      }
      function guessPlatform(ua, deviceId) {
        // 面板自己发起的操作有固定前缀，不用猜
        if (String(deviceId || "").indexOf("panel@") === 0) return "面板";
        // 没有 UA 就别硬猜成 Web —— 服务端 fetch 本来就不总带这个头
        if (!ua) return "";
        const s = ua.toLowerCase();
        if (s.indexOf("android") >= 0) return "Android";
        if (s.indexOf("iphone") >= 0 || s.indexOf("ipad") >= 0) return "iOS";
        if (s.indexOf("electron") >= 0) return "桌面";
        if (s.indexOf("undici") >= 0 || s.indexOf("node") >= 0) return "服务端";
        if (s.indexOf("mobile") >= 0) return "移动";
        return "Web";
      }

      /** 服务端失败码 → 人话。面板上不该出现 invalid_changes 这种给机器看的东西 */
      function describeServerError(code) {
        const map = {
          unauthorized: "令牌不正确或已失效",
          invalid_json: "请求体不是合法 JSON",
          invalid_body: "请求体结构不对",
          missing_device_id: "缺少 deviceId",
          changes_must_be_array: "changes 不是数组",
          batch_too_large: "单批超过 50 条",
          invalid_changes: "卡片字段不合法",
          payload_too_large: "请求体超过 1 MB",
          invalid_since: "游标参数非法",
          invalid_limit: "limit 参数非法",
          stale_write: "服务端已有更新版本",
          not_found: "目标不存在"
        };
        return map[code] || code || "未知错误";
      }

      /* ============================================================
       * HTTP
       * ========================================================== */
      let token = localStorage.getItem(LS_TOKEN) || "";
      let authed = false;
      let pendingCard = null;

      async function api(path, opts) {
        opts = opts || {};
        const headers = Object.assign({}, opts.headers || {});
        if (token) headers["Authorization"] = "Bearer " + token;
        if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
        const res = await fetch(path, Object.assign({}, opts, { headers: headers }));
        if (res.status === 401) {
          const e = new Error("unauthorized");
          e.code = 401;
          throw e;
        }
        if (!res.ok) {
          let msg = "HTTP " + res.status;
          try {
            const j = await res.json();
            if (j && j.error) msg = j.error;
          } catch (e) {}
          const err = new Error(msg);
          err.code = res.status;
          throw err;
        }
        return res.json();
      }
      function post(path, body) {
        return api(path, { method: "POST", body: body ? JSON.stringify(body) : undefined });
      }

      /* ============================================================
       * 状态
       * ========================================================== */
      const S = {
        overview: null,
        cards: [],
        total: 0,
        filter: { status: "all", q: "" },
        /** 动态筛：按事件类型 + 按设备（点设备卡片切换） */
        feed: { kind: "all", device: null },
        offset: 0,
        limit: 12,
        events: [],
        lastEventId: 0,
        devices: [],
        clockOffset: 0,
        selected: null,
        lastFocus: null,
        timers: [],
        alive: true
      };

      const STAT_DEFS = [
        { key: "total", label: "总卡片", tone: "var(--accent)", sub: "含墓碑" },
        { key: "open", label: "进行中", tone: "var(--warn)", sub: "还没勾完" },
        { key: "done", label: "已完成", tone: "var(--ok)", sub: "全部勾完" },
        { key: "archived", label: "已归档", tone: "var(--muted)", sub: "从轴上摘下" },
        { key: "deleted", label: "墓碑", tone: "var(--danger)", sub: "软删除" },
        { key: "maxSeq", label: "游标 seq", tone: "var(--info)", sub: "增量水位", mono: true }
      ];

      const STATUS_LABEL = { open: "进行中", done: "已完成", archived: "已归档", deleted: "已删除" };

      /* ============================================================
       * 主题
       * ========================================================== */
      const ICON_SUN =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
      const ICON_MOON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>';
      const ICON_OUT =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 12H3m0 0 3.5-3.5M3 12l3.5 3.5"/></svg>';
      const ICON_CHECK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>';
      const ICON_HEART =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.4A3.6 3.6 0 0 1 12 7a3.6 3.6 0 0 1 7 3.6C19 15.6 12 20 12 20Z"/></svg>';

      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem(LS_THEME, theme);
        const btn = $("#btn-theme");
        if (btn) btn.innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;
      }
      function initTheme() {
        const saved = localStorage.getItem(LS_THEME);
        const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        applyTheme(saved || (dark ? "dark" : "light"));
      }
      function toggleTheme() {
        const cur = document.documentElement.getAttribute("data-theme");
        applyTheme(cur === "dark" ? "light" : "dark");
      }

      /* ============================================================
       * Toast
       * ========================================================== */
      function toast(msg, kind) {
        const el = document.createElement("div");
        el.className = "toast " + (kind || "");
        el.textContent = msg;
        $("#toasts").appendChild(el);
        requestAnimationFrame(function () {
          el.classList.add("in");
        });
        setTimeout(function () {
          el.classList.remove("in");
          setTimeout(function () {
            el.remove();
          }, 320);
        }, 3200);
      }

      /* ============================================================
       * 启动 / 门
       * ========================================================== */
      function setGateHint(text, isErr) {
        const h = $("#gate-hint");
        h.textContent = text;
        h.className = "gate-hint" + (isErr ? " err" : "");
      }

      async function probeGateLive() {
        const box = $("#gate-live");
        try {
          const res = await fetch("/api/health");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const b = await res.json();
          box.innerHTML =
            '<span class="dot" style="background: var(--ok)"></span>' +
            "<span>服务在线 · v" +
            esc(b.version || "?") +
            " · " +
            (b.cardCount != null ? b.cardCount + " 张卡" : "") +
            "</span>";
        } catch (e) {
          box.innerHTML =
            '<span class="dot" style="background: var(--danger)"></span>' +
            "<span>探测不到服务（可能网络不通）</span>";
        }
      }

      function showGate() {
        authed = false;
        stopPolling();
        $("#app").hidden = true;
        $("#gate").hidden = false;
        $("#gate-token").value = token || "";
        $("#gate-token").focus();
        probeGateLive();
      }

      function enterApp(overview) {
        authed = true;
        $("#gate").hidden = true;
        $("#app").hidden = false;
        S.overview = overview;
        S.clockOffset = (overview.serverTime || Date.now()) - Date.now();
        buildStats();
        renderOverview();
        startPolling();
        refreshCards(true);
        if (pendingCard) {
          const pid = pendingCard;
          pendingCard = null;
          openCard(pid);
        }
      }

      async function tryEnter(withToken) {
        token = withToken || "";
        try {
          const ov = await api("/api/admin/overview");
          localStorage.setItem(LS_TOKEN, token);
          enterApp(ov);
          return true;
        } catch (e) {
          if (e.code === 401) {
            localStorage.removeItem(LS_TOKEN);
            token = "";
            setGateHint("令牌不正确 —— 服务器返回 401，再试一次？", true);
            return false;
          }
          setGateHint("连不上服务器：" + (e.message || e), true);
          return false;
        }
      }

      function logout(silent) {
        localStorage.removeItem(LS_TOKEN);
        token = "";
        S.events = [];
        S.lastEventId = 0;
        if (!silent) toast("已退出，令牌已从本机清除");
        showGate();
      }

      /* ============================================================
       * 轮询
       * ========================================================== */
      function stopPolling() {
        S.timers.forEach(clearInterval);
        S.timers = [];
      }
      function startPolling() {
        stopPolling();
        // 概览 4 秒一次就够：里面只有内存/体积/设备这类慢变量；
        // 秒针靠本地时钟走，不占请求。
        S.timers.push(setInterval(refreshOverview, 4000));
        S.timers.push(setInterval(function () {
          if (!document.hidden) refreshEvents(false);
        }, 2500));
        S.timers.push(setInterval(refreshClock, 1000));
        S.timers.push(setInterval(function () {
          // 抽屉打开时别刷新列表：会打断滚动位置，用户还看不见
          if (!document.hidden && $("#drawer").hidden) refreshCards(true);
        }, 12000));
        refreshEvents(true);
        refreshClock();
      }

      async function refreshOverview() {
        if (document.hidden) return;
        try {
          const ov = await api("/api/admin/overview");
          S.overview = ov;
          S.clockOffset = (ov.serverTime || Date.now()) - Date.now();
          renderOverview();
          setLive(true);
        } catch (e) {
          if (e.code === 401) return logout(true);
          setLive(false);
        }
      }

      async function refreshEvents(first) {
        try {
          const since = first ? 0 : S.lastEventId;
          const data = await api("/api/admin/events?since=" + since + "&limit=120");
          const incoming = data.events || [];
          if (first) S.events = incoming.slice();
          else S.events = S.events.concat(incoming);
          if (S.events.length > 160) S.events = S.events.slice(S.events.length - 160);
          if (data.latestId && data.latestId > S.lastEventId) S.lastEventId = data.latestId;
          renderFeed();
        } catch (e) {
          if (e.code === 401) logout(true);
        }
      }

      function refreshClock() {
        const now = Date.now() + S.clockOffset;
        const d = new Date(now);
        const c = $("#clock");
        const cd = $("#clock-date");
        if (c) c.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
        if (cd) {
          const wd = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
          cd.textContent = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + wd;
        }
      }

      function setLive(up) {
        S.alive = up;
        renderStatus();
      }

      /**
       * 状态文案要考虑"活着但一直失败"这种情况。
       * 只按「刚才那次请求成没成」上色的话，令牌过期一整排 401 也显示运行正常。
       */
      function renderStatus() {
        const pill = $("#live-pill");
        const hero = $("#hero");
        if (!pill || !hero) return;
        const up = S.alive;
        const lm = (S.overview && S.overview.activity && S.overview.activity.lastMinute) || null;
        const failed = lm ? lm.failed || 0 : 0;
        const degraded = up && failed > 0;

        pill.classList.toggle("down", !up);
        pill.classList.toggle("warn", degraded);
        const lp = pill.querySelector(".lp-text");
        if (lp) lp.textContent = up ? (degraded ? "有失败" : "LIVE") : "断开";
        hero.classList.toggle("down", !up);
        hero.classList.toggle("warn", degraded);

        $("#hero-title").textContent = !up
          ? "连接中断"
          : degraded
            ? "有 " + failed + " 次失败请求"
            : "运行正常";

        const sub = $("#hero-sub");
        if (sub && S.overview) {
          let extra = "";
          if (up && lm) {
            extra = " · 近一分钟 推 " + lm.push + " / 拉 " + lm.pull;
            if (failed) extra += " / 失败 " + failed;
          }
          sub.textContent = "挂卡时间轴同步服务 · v" + (S.overview.version || "?") + extra;
        }
      }

      /* ============================================================
       * 渲染 · 概览
       * ========================================================== */
      function buildStats() {
        const wrap = $("#stats");
        wrap.innerHTML = STAT_DEFS.map(function (d) {
          return (
            '<div class="stat" style="--tone:' +
            d.tone +
            '">' +
            '<div class="stat-label"><i></i>' +
            esc(d.label) +
            "</div>" +
            '<div class="stat-num' +
            (d.mono ? " mono" : "") +
            '" id="stat-' +
            d.key +
            '">0</div>' +
            '<div class="stat-sub">' +
            esc(d.sub) +
            "</div>" +
            "</div>"
          );
        }).join("");
      }

      const lastNums = {};
      function countUp(key, to) {
        const el = $("#stat-" + key);
        if (!el) return;
        const from = lastNums[key];
        lastNums[key] = to;
        // 首屏（还没有旧值）或数值没变：直接落最终值，别做动画 ——
        // 否则截图/首帧会停在半路，看起来像数据错了。
        if (from === undefined || from === to) {
          el.textContent = to;
          return;
        }
        const start = performance.now();
        const dur = 520;
        function step(t) {
          const p = Math.min(1, (t - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          const v = Math.round(from + (to - from) * eased);
          el.textContent = v;
          if (p < 1) requestAnimationFrame(step);
          else el.textContent = to;
        }
        requestAnimationFrame(step);
      }

      /* 芯片定义：只建一次，之后只改数字 —— 整块重建会把火花图反复清零，
         每 3 秒闪一次，看起来像图表在抖。 */
      const CHIP_DEFS = [
        { id: "uptime", k: "已运行" },
        { id: "runtime", k: "运行环境" },
        { id: "mem", k: "内存" },
        { id: "db", k: "数据库" },
        { id: "act", k: "近一分钟" },
        { id: "buffered", k: "事件缓冲" }
      ];

      function ensureChips() {
        const chips = $("#hero-chips");
        if (!chips || chips.dataset.ready === "1") return;
        chips.innerHTML =
          CHIP_DEFS.map(function (d) {
            return (
              '<span class="chip"><span class="k">' +
              esc(d.k) +
              '</span><b id="chip-' +
              d.id +
              '">—</b></span>'
            );
          }).join("");
        chips.dataset.ready = "1";
      }

      function setChip(id, value) {
        const el = document.getElementById("chip-" + id);
        if (!el) return;
        const v = String(value);
        // 只在真的变了才写 DOM，省掉无谓的重排
        if (el.textContent !== v) el.textContent = v;
      }

      function renderOverview() {
        const ov = S.overview;
        if (!ov) return;
        const st = ov.stats || {};
        STAT_DEFS.forEach(function (d) {
          countUp(d.key, Number(st[d.key] || 0));
        });

        const rt = ov.runtime || {};
        const lm = (ov.activity && ov.activity.lastMinute) || null;
        ensureChips();
        setChip("uptime", fmtDur(ov.uptimeMs));
        setChip("runtime", rt.kind === "node" ? "Node " + (rt.nodeVersion || "") : "Cloudflare Worker");
        setChip("mem", rt.memoryBytes != null ? fmtBytes(rt.memoryBytes) : "—");
        setChip("db", rt.dbSizeBytes != null ? fmtBytes(rt.dbSizeBytes) : "—");
        setChip("act", lm ? "推 " + lm.push + " · 拉 " + lm.pull : "—");
        setChip("buffered", (ov.activity && ov.activity.buffered) || 0);

        renderStatus();

        S.devices = ov.devices || [];
        renderDevices();
      }

      /* ============================================================
       * 渲染 · 设备
       * ========================================================== */
      function renderDevices() {
        const wrap = $("#devices");
        const list = S.devices || [];
        $("#dev-count").textContent = list.length ? list.length + " 台" : "";
        if (!list.length) {
          wrap.innerHTML = '<div class="empty" style="padding:18px 0">还没有设备同步过</div>';
          return;
        }
        const now = Date.now();
        wrap.innerHTML = list
          .map(function (d) {
            const online = now - d.lastSeen < 120000;
            const isPanel = String(d.deviceId).indexOf("panel@") === 0;
            const plat = guessPlatform(d.lastUa, d.deviceId);
            const active = S.feed.device === d.deviceId ? " active" : "";
            const meta = isPanel
              ? "操作 " + (d.adminOps || 0) +
                (d.failures ? " · 失败 " + d.failures : "") +
                " · " + relTime(d.lastSeen)
              : "推 " + d.pushes + " · 拉 " + d.pulls + " · 写 " + d.cardsWritten + " · " + relTime(d.lastSeen);
            const failTag =
              !isPanel && d.failures ? ' · <span class="dev-fail">失败 ' + d.failures + "</span>" : "";
            return (
              '<button class="dev' +
              active +
              '" data-dev="' +
              esc(d.deviceId) +
              '" title="' +
              esc(d.deviceId) +
              '（点击只看这台）">' +
              '<span class="dev-dot ' +
              (online ? "on" : "") +
              '"></span>' +
              '<div class="dev-main">' +
              '<div class="dev-name">' +
              esc(shortId(d.deviceId)) +
              "</div>" +
              '<div class="dev-meta">' +
              esc(meta) +
              failTag +
              "</div>" +
              "</div>" +
              (plat ? '<span class="dev-plat' + (isPanel ? " panel" : "") + '">' + esc(plat) + "</span>" : "") +
              "</button>"
            );
          })
          .join("");
      }

      /* ============================================================
       * 渲染 · 动态
       * ========================================================== */
      function evtIcon(kind) {
        if (kind === "push") return "↑";
        if (kind === "pull") return "↓";
        return "⚙";
      }

      function filteredEvents() {
        return S.events.filter(function (e) {
          if (S.feed.kind !== "all" && e.kind !== S.feed.kind) return false;
          if (S.feed.device && e.deviceId !== S.feed.device) return false;
          return true;
        });
      }

      function renderFeedTools() {
        const wrap = $("#feed-tools");
        if (!wrap) return;
        const counts = { all: S.events.length, push: 0, pull: 0, admin: 0 };
        S.events.forEach(function (e) {
          counts[e.kind] = (counts[e.kind] || 0) + 1;
        });
        const defs = [
          { k: "all", label: "全部" },
          { k: "push", label: "推送" },
          { k: "pull", label: "拉取" },
          { k: "admin", label: "面板" }
        ];
        let html = defs
          .map(function (d) {
            const active = S.feed.kind === d.k ? " active" : "";
            return (
              '<button class="fchip' +
              active +
              '" data-kind="' +
              d.k +
              '" aria-pressed="' +
              (S.feed.kind === d.k) +
              '">' +
              esc(d.label) +
              " <b>" +
              (counts[d.k] || 0) +
              "</b></button>"
            );
          })
          .join("");
        if (S.feed.device) {
          html +=
            '<span class="feed-dev"><b title="' +
            esc(S.feed.device) +
            '">' +
            esc(shortId(S.feed.device)) +
            '</b><button data-clear-dev="1" title="清除设备筛选" aria-label="清除设备筛选">✕</button></span>';
        }
        wrap.innerHTML = html;
      }

      function renderFeed() {
        const wrap = $("#feed");
        const filtered = filteredEvents();
        const list = filtered.slice().reverse();
        renderFeedTools();
        $("#feed-count").textContent =
          filtered.length === S.events.length
            ? S.events.length
              ? "最近 " + S.events.length + " 条"
              : ""
            : filtered.length + " / " + S.events.length + " 条";
        if (!list.length) {
          wrap.innerHTML =
            '<div class="empty" style="padding:20px 0">' +
            (S.events.length ? "这个筛选下没有记录" : "还没有同步活动") +
            "</div>";
          return;
        }
        wrap.innerHTML = list
          .map(function (e) {
            const failed = e.ok === false;
            const kindName = { push: "推送", pull: "拉取", admin: "面板操作" }[e.kind] || "请求";
            let lineHtml = "";
            let sub = "";
            if (failed) {
              lineHtml = '<span class="evt-fail-txt">' + esc(kindName) + "失败</span>";
              sub = describeServerError(e.error) + (e.ms ? " · " + e.ms + "ms" : "");
            } else if (e.kind === "push") {
              let line = "推送 " + (e.accepted || 0) + " 张";
              if (e.rejected) line += " · 拒绝 " + e.rejected;
              if (e.unchanged) line += " · 跳过 " + e.unchanged;
              lineHtml = esc(line);
              sub = "游标 → " + e.cursor + " · " + e.ms + "ms";
            } else if (e.kind === "pull") {
              lineHtml = esc("拉取 " + (e.pulled || 0) + " 条");
              sub = "游标 " + e.cursor + " · " + e.ms + "ms";
            } else {
              const actMap = { delete: "软删除", restore: "恢复", optimize: "整理数据库" };
              let line = actMap[e.action] || e.action || "操作";
              if (e.cardId) line += " · " + shortId(e.cardId);
              lineHtml = esc(line);
              sub = "面板操作" + (e.ms ? " · " + e.ms + "ms" : "");
            }
            return (
              '<div class="evt' +
              (failed ? " failed" : "") +
              '">' +
              '<span class="evt-ico ' +
              (failed ? "fail" : esc(e.kind)) +
              '">' +
              (failed ? "!" : evtIcon(e.kind)) +
              "</span>" +
              '<div class="evt-main">' +
              '<div class="evt-line"><span class="evt-dev" title="' +
              esc(e.deviceId) +
              '">' +
              esc(shortId(e.deviceId)) +
              "</span><span>" +
              lineHtml +
              "</span></div>" +
              '<div class="evt-sub">' +
              esc(sub) +
              "</div>" +
              "</div>" +
              '<span class="evt-time">' +
              esc(relTime(e.at)) +
              "</span>" +
              "</div>"
            );
          })
          .join("");
      }

      /* ============================================================
       * 渲染 · 卡片
       * ========================================================== */
      function buildFilters() {
        const st = (S.overview && S.overview.stats) || {};
        const defs = [
          { key: "all", label: "全部", n: st.total || 0 },
          { key: "open", label: "进行中", n: st.open || 0 },
          { key: "done", label: "已完成", n: st.done || 0 },
          { key: "archived", label: "已归档", n: st.archived || 0 },
          { key: "deleted", label: "已删除", n: st.deleted || 0 }
        ];
        $("#filters").innerHTML = defs
          .map(function (d) {
            const active = S.filter.status === d.key ? " active" : "";
            return (
              '<button class="fchip' +
              active +
              '" data-status="' +
              d.key +
              '">' +
              esc(d.label) +
              " <b>" +
              d.n +
              "</b></button>"
            );
          })
          .join("");
        $$("#filters .fchip").forEach(function (b) {
          b.addEventListener("click", function () {
            S.filter.status = b.getAttribute("data-status");
            S.offset = 0;
            buildFilters();
            refreshCards(true);
          });
        });
      }

      async function refreshCards(reset) {
        if (reset) S.offset = 0;
        try {
          const q = encodeURIComponent(S.filter.q);
          const data = await api(
            "/api/admin/cards?status=" +
              S.filter.status +
              "&q=" +
              q +
              "&limit=" +
              S.limit +
              "&offset=" +
              S.offset
          );
          S.cards = data.rows || [];
          S.total = data.total || 0;
          renderCards();
          if (S.overview) buildFilters();
        } catch (e) {
          if (e.code === 401) logout(true);
        }
      }

      function progressOf(card) {
        const items = card.items || [];
        const done = items.filter(function (i) {
          return i.done;
        }).length;
        return { done: done, total: items.length, ratio: items.length ? done / items.length : 0 };
      }

      function statusBadge(card) {
        if (card.deletedAt) return '<span class="badge deleted">已删除</span>';
        const s = card.status || "open";
        return '<span class="badge ' + s + '">' + (STATUS_LABEL[s] || s) + "</span>";
      }

      function renderCards() {
        const wrap = $("#card-list");
        $("#cards-count").textContent = S.total + " 张";
        if (!S.cards.length) {
          wrap.innerHTML =
            '<div class="empty"><span class="fish">' +
            FISH_SVG +
            "</span><div>这个筛选下没有卡片</div></div>";
          updatePager();
          return;
        }
        wrap.innerHTML = S.cards
          .map(function (row) {
            const c = row.card || {};
            const p = progressOf(c);
            const del = !!c.deletedAt;
            const title = c.title && c.title.trim() ? c.title : "（无标题）";
            const tag = c.tag ? '<span class="tag">' + esc(c.tag) + "</span>" : "";
            const prog = p.total
              ? '<div class="prog"><div class="prog-track"><div class="prog-fill" style="width:' +
                Math.round(p.ratio * 100) +
                '%"></div></div><span>' +
                p.done +
                "/" +
                p.total +
                "</span></div>"
              : '<div class="prog"><span>空卡</span></div>';
            return (
              '<button class="crow" data-id="' +
              esc(c.id) +
              '">' +
              '<span class="crow-bar" style="background:' +
              safeColor(c.color) +
              '"></span>' +
              '<div class="crow-main">' +
              '<div class="crow-title"><span class="tt">' +
              esc(title) +
              "</span>" +
              tag +
              "</div>" +
              '<div class="crow-meta">' +
              "<span>" +
              esc(fmtDateTime(c.anchorAt)) +
              "</span>" +
              '<span class="sep"></span>' +
              "<span>更新 " +
              esc(relTime(c.updatedAt)) +
              "</span>" +
              (row.lastDeviceId
                ? '<span class="sep"></span><span title="' + esc(row.lastDeviceId) + '">' + esc(shortId(row.lastDeviceId)) + "</span>"
                : "") +
              "</div>" +
              "</div>" +
              '<div class="crow-right">' +
              prog +
              statusBadge(c) +
              "</div>" +
              "</button>"
            );
          })
          .join("");
        $$("#card-list .crow").forEach(function (btn) {
          btn.addEventListener("click", function () {
            openCard(btn.getAttribute("data-id"));
          });
        });
        updatePager();
      }

      function updatePager() {
        const start = S.total === 0 ? 0 : S.offset + 1;
        const end = Math.min(S.offset + S.limit, S.total);
        $("#pager-info").textContent =
          S.total === 0 ? "共 0 张" : "共 " + S.total + " 张 · 显示 " + start + "–" + end;
        $("#prev").disabled = S.offset <= 0;
        $("#next").disabled = S.offset + S.limit >= S.total;
      }

      /* ============================================================
       * 抽屉 · 卡片详情
       * ========================================================== */
      async function openCard(id) {
        let data;
        try {
          data = await api("/api/admin/cards/" + encodeURIComponent(id));
        } catch (e) {
          if (e.code === 401) return logout(true);
          toast("读不到这张卡：" + e.message, "err");
          return;
        }
        S.selected = data;
        // 记住打开前的焦点，关抽屉时还回去 —— 否则键盘用户会被扔回页面顶部
        S.lastFocus = document.activeElement;
        renderDrawer(data);
        const dr = $("#drawer");
        dr.hidden = false;
        requestAnimationFrame(function () {
          dr.classList.add("open");
        });
        setTimeout(function () {
          const close = $("#dt-close");
          if (close) close.focus();
        }, 80);
      }

      function closeDrawer() {
        const dr = $("#drawer");
        dr.classList.remove("open");
        setTimeout(function () {
          dr.hidden = true;
        }, 260);
        S.selected = null;
        const back = S.lastFocus;
        S.lastFocus = null;
        if (back && typeof back.focus === "function") {
          try {
            back.focus();
          } catch (e) {}
        }
      }

      /** 抽屉里的 Tab 循环，别让焦点跑到背后的页面上 */
      function trapTab(e) {
        const panel = $("#dt-panel");
        if (!panel) return;
        const nodes = panel.querySelectorAll(
          'button:not([disabled]), [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        if (!nodes.length) return;
        const first = nodes[0];
        const last = nodes[nodes.length - 1];
        const active = document.activeElement;
        if (e.shiftKey && (active === first || !panel.contains(active))) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function renderDrawer(data) {
        const c = data.card || {};
        const del = !!c.deletedAt;
        const p = progressOf(c);
        $("#dt-title").textContent = c.title && c.title.trim() ? c.title : "（无标题）";

        const chips = [];
        chips.push(statusBadge(c));
        if (c.tag) chips.push('<span class="tag">' + esc(c.tag) + "</span>");
        chips.push('<span class="tag mono">' + esc(shortId(data.lastDeviceId)) + "</span>");
        $("#dt-sub").innerHTML = chips.join("");

        const items = c.items || [];
        const itemsHtml = items.length
          ? '<div class="items">' +
            items
              .map(function (it) {
                return (
                  '<div class="item-row ' +
                  (it.done ? "done" : "") +
                  '">' +
                  '<span class="item-box ' +
                  (it.done ? "on" : "") +
                  '">' +
                  (it.done ? ICON_CHECK : "") +
                  "</span>" +
                  '<span class="item-text">' +
                  esc(it.text || "（空）") +
                  "</span>" +
                  "</div>"
                );
              })
              .join("") +
            "</div>"
          : '<div class="empty" style="padding:12px 0;text-align:left">这张卡没有条目</div>';

        const kv = [
          ["卡片 ID", '<span class="mono">' + esc(c.id) + "</span>"],
          ["状态", esc(STATUS_LABEL[c.status] || c.status || "—") + (del ? "（已软删除）" : "")],
          ["挂载时间", esc(fmtDateTime(c.anchorAt))],
          ["创建时间", esc(fmtDateTime(c.createdAt))],
          ["最后更新", esc(fmtDateTime(c.updatedAt)) + " · " + esc(relTime(c.updatedAt))],
          ["软删除", del ? esc(fmtDateTime(c.deletedAt)) : "否"],
          ["修订号 rev", esc(c.rev)],
          ["服务端游标", '<span class="mono">seq ' + esc(data.seq) + "</span>"],
          ["完成度", p.total ? p.done + " / " + p.total : "无条目"]
        ];

        $("#dt-body").innerHTML =
          '<div class="dsec"><h3>条目（' +
          items.length +
          "）</h3>" +
          itemsHtml +
          "</div>" +
          '<div class="dsec"><h3>信息</h3><dl class="kv">' +
          kv
            .map(function (row) {
              return "<dt>" + esc(row[0]) + "</dt><dd>" + row[1] + "</dd>";
            })
            .join("") +
          "</dl></div>" +
          '<div class="dsec"><h3>操作</h3><div class="dact">' +
          (del
            ? '<button class="btn primary sm" id="act-restore">恢复这张卡</button>'
            : '<button class="btn danger sm" id="act-delete">软删除</button>') +
          '<button class="btn sm" id="act-copy-id">复制 ID</button>' +
          '<button class="btn sm" id="act-copy-json">复制 JSON</button>' +
          "</div></div>" +
          '<div class="dsec"><h3>原始 JSON</h3><div class="json-box">' +
          esc(JSON.stringify(c, null, 2)) +
          "</div></div>";

        const delBtn = $("#act-delete");
        if (delBtn)
          delBtn.addEventListener("click", function () {
            doCardAction("delete", c.id);
          });
        const resBtn = $("#act-restore");
        if (resBtn)
          resBtn.addEventListener("click", function () {
            doCardAction("restore", c.id);
          });
        $("#act-copy-id").addEventListener("click", function () {
          copyText(c.id, "卡片 ID 已复制");
        });
        $("#act-copy-json").addEventListener("click", function () {
          copyText(JSON.stringify(c, null, 2), "JSON 已复制");
        });
      }

      async function doCardAction(action, id) {
        const btn = action === "delete" ? $("#act-delete") : $("#act-restore");
        if (btn) {
          btn.disabled = true;
          btn.textContent = "处理中…";
        }
        try {
          const res = await post("/api/admin/cards/" + encodeURIComponent(id) + "/" + action);
          if (res && res.ok === false) {
            toast("操作被服务器拒绝（可能有更新的版本）", "err");
          } else {
            toast(action === "delete" ? "已软删除，各设备会在下次同步时同步" : "已恢复", "ok");
          }
          await refreshCards(true);
          await refreshOverview();
          await refreshEvents(false);
          if (S.selected && S.selected.card.id === id) {
            try {
              const fresh = await api("/api/admin/cards/" + encodeURIComponent(id));
              S.selected = fresh;
              renderDrawer(fresh);
            } catch (e) {}
          }
        } catch (e) {
          if (e.code === 401) return logout(true);
          toast("操作失败：" + e.message, "err");
          if (btn) {
            btn.disabled = false;
            btn.textContent = action === "delete" ? "软删除" : "恢复这张卡";
          }
        }
      }

      function copyText(text, okMsg) {
        const done = function () {
          toast(okMsg || "已复制", "ok");
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () {
            fallbackCopy(text);
            done();
          });
        } else {
          fallbackCopy(text);
          done();
        }
      }
      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
        } catch (e) {}
        ta.remove();
      }

      /* ============================================================
       * 事件绑定
       * ========================================================== */
      function bind() {
        $("#gate-fish").innerHTML = FISH_SVG;
        $("#top-fish").innerHTML = FISH_SVG;
        $("#foot-fish").innerHTML = FISH_SVG;
        $("#btn-theme").innerHTML = ICON_MOON;
        $("#btn-logout").innerHTML = ICON_OUT;
        $("#hero-orb").innerHTML = ICON_HEART;

        $("#btn-theme").addEventListener("click", toggleTheme);
        $("#btn-logout").addEventListener("click", function () {
          logout(false);
        });

        $("#gate-eye").addEventListener("click", function () {
          const inp = $("#gate-token");
          const show = inp.type === "password";
          inp.type = show ? "text" : "password";
          this.textContent = show ? "隐藏" : "显示";
        });
        $("#gate-form").addEventListener("submit", function (ev) {
          ev.preventDefault();
          const val = $("#gate-token").value.trim();
          const btn = $("#gate-submit");
          btn.disabled = true;
          btn.textContent = "验证中…";
          setGateHint("正在验证令牌…", false);
          tryEnter(val).then(function () {
            btn.disabled = false;
            btn.textContent = "进入控制台";
          });
        });

        let searchTimer = null;
        const searchInput = $("#search");
        const searchClear = $("#search-clear");

        function syncSearchClear() {
          if (searchClear) searchClear.hidden = !searchInput.value;
        }

        searchInput.addEventListener("input", function () {
          const v = this.value;
          syncSearchClear();
          if (searchTimer) clearTimeout(searchTimer);
          // 260ms 防抖：输入「装修」只打一次接口，不是四次
          searchTimer = setTimeout(function () {
            S.filter.q = v.trim();
            S.offset = 0;
            refreshCards(true);
          }, 260);
        });

        if (searchClear) {
          searchClear.addEventListener("click", function () {
            searchInput.value = "";
            syncSearchClear();
            S.filter.q = "";
            S.offset = 0;
            refreshCards(true);
            searchInput.focus();
          });
        }

        // 动态筛选 / 设备点选（事件委托，避免每次重渲染重复绑定）
        const feedTools = $("#feed-tools");
        if (feedTools) {
          feedTools.addEventListener("click", function (ev) {
            const t = ev.target;
            if (!t || !t.closest) return;
            const kindBtn = t.closest("[data-kind]");
            if (kindBtn) {
              S.feed.kind = kindBtn.getAttribute("data-kind") || "all";
              renderFeed();
              return;
            }
            if (t.closest("[data-clear-dev]")) {
              S.feed.device = null;
              renderFeed();
              renderDevices();
            }
          });
        }
        const devWrap = $("#devices");
        if (devWrap) {
          devWrap.addEventListener("click", function (ev) {
            const t = ev.target;
            if (!t || !t.closest) return;
            const btn = t.closest("[data-dev]");
            if (!btn) return;
            const id = btn.getAttribute("data-dev");
            S.feed.device = S.feed.device === id ? null : id;
            renderFeed();
            renderDevices();
          });
        }

        $("#btn-refresh").addEventListener("click", function () {
          refreshCards(true);
          refreshOverview();
          refreshEvents(false);
        });
        $("#prev").addEventListener("click", function () {
          if (S.offset > 0) {
            S.offset = Math.max(0, S.offset - S.limit);
            refreshCards(false);
          }
        });
        $("#next").addEventListener("click", function () {
          if (S.offset + S.limit < S.total) {
            S.offset += S.limit;
            refreshCards(false);
          }
        });

        $("#dt-close").addEventListener("click", closeDrawer);
        $$('#drawer [data-close]').forEach(function (el) {
          el.addEventListener("click", closeDrawer);
        });
        document.addEventListener("keydown", function (e) {
          const drawerOpen = !$("#drawer").hidden;
          if (e.key === "Escape" && drawerOpen) {
            closeDrawer();
            return;
          }
          if (drawerOpen && e.key === "Tab") {
            trapTab(e);
            return;
          }
          // "/" 快速聚焦搜索（要避开正在输入的框）
          const tag = (e.target && e.target.tagName) || "";
          const typing = tag === "INPUT" || tag === "TEXTAREA" || e.target.isContentEditable;
          if (e.key === "/" && !typing && !drawerOpen) {
            e.preventDefault();
            searchInput.focus();
            searchInput.select();
          }
        });

        $("#export-link").addEventListener("click", function (e) {
          e.preventDefault();
          // 导出是 GET 且需要 Bearer，普通 <a> 带不上头 —— 用 fetch 拿 blob 再存。
          fetch("/api/admin/export", { headers: token ? { Authorization: "Bearer " + token } : {} })
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.blob();
            })
            .then(function (blob) {
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = "timecard-export-" + Date.now() + ".json";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(function () {
                URL.revokeObjectURL(url);
              }, 1000);
              toast("已导出全部卡片", "ok");
            })
            .catch(function (e) {
              toast("导出失败：" + e.message, "err");
            });
        });

        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && authed) {
            refreshOverview();
            refreshEvents(false);
          }
        });
      }

      /* ============================================================
       * 启动
       * ========================================================== */
      initTheme();
      bind();
      (async function boot() {
        // 片段参数（都只在 # 里，不发服务器）：
        //   #token=xxx  一次性登录（读完立刻从地址栏抹掉）
        //   #theme=dark|light  强制主题（截图 / 演示）
        //   #card=<id>  登录后直接打开某张卡的详情抽屉
        const hash = location.hash || "";
        const themeM = /(?:^#|&)theme=(dark|light)/.exec(hash);
        if (themeM) applyTheme(themeM[1]);
        const tokenM = /(?:^#|&)token=([^&]+)/.exec(hash);
        const cardM = /(?:^#|&)card=([^&]+)/.exec(hash);
        if (tokenM || cardM) {
          if (cardM) pendingCard = decodeURIComponent(cardM[1]);
          try {
            history.replaceState(null, "", location.pathname + location.search);
          } catch (e) {}
          if (tokenM) {
            token = decodeURIComponent(tokenM[1]);
            const ok = await tryEnter(token);
            if (!ok) showGate();
            return;
          }
        }
        if (token) {
          const ok = await tryEnter(token);
          if (!ok) showGate();
        } else {
          // 可能是「开发模式没设令牌」，先不带令牌试一次
          try {
            const ov = await api("/api/admin/overview");
            enterApp(ov);
          } catch (e) {
            showGate();
          }
        }
      })();
    </script>
  </body>
</html>
