<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>挂卡时间轴 · 同步控制台</title>
    <style>
      /* ============================================================
       * 设计 token —— 沿用应用「自然有机」的米纸底 + 森林绿，
       * 但做成中性的监控台配色，并配一套深色。
       * ========================================================== */
      :root {
        --bg: #f3f1ea;
        --bg-g1: rgba(113, 128, 90, 0.12);
        --bg-g2: rgba(198, 168, 120, 0.12);
        --surface: #fffdf9;
        --surface-2: #f8f5ee;
        --surface-3: #f0ece1;
        --ink: #28251f;
        --ink-2: #4b463b;
        --muted: #8b8476;
        --line: rgba(60, 50, 30, 0.12);
        --line-2: rgba(60, 50, 30, 0.2);
        --accent: #5f7a4f;
        --accent-2: #71805a;
        --accent-ink: #fbfdf7;
        --accent-soft: #e6ecdb;
        --ok: #4d8a5c;
        --ok-soft: #e2efe3;
        --warn: #b0801f;
        --warn-soft: #f6ead0;
        --danger: #bf5138;
        --danger-soft: #f7e0d9;
        --info: #4472a0;
        --info-soft: #e2ecf6;
        --radius: 16px;
        --radius-sm: 11px;
        --radius-lg: 22px;
        --shadow: 0 1px 2px rgba(40, 32, 18, 0.05), 0 14px 34px -22px rgba(60, 45, 20, 0.45);
        --shadow-sm: 0 1px 2px rgba(40, 32, 18, 0.07);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          "Noto Sans SC", system-ui, sans-serif;
        --mono: "SFMono-Regular", ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      }
      html[data-theme="dark"] {
        --bg: #101316;
        --bg-g1: rgba(113, 128, 90, 0.16);
        --bg-g2: rgba(74, 127, 181, 0.1);
        --surface: #191d22;
        --surface-2: #1f242b;
        --surface-3: #252b33;
        --ink: #eef1f4;
        --ink-2: #c6ccd4;
        --muted: #8b94a1;
        --line: rgba(255, 255, 255, 0.09);
        --line-2: rgba(255, 255, 255, 0.16);
        --accent: #8db377;
        --accent-2: #8db377;
        --accent-ink: #12160f;
        --accent-soft: rgba(141, 179, 119, 0.16);
        --ok: #6cbf83;
        --ok-soft: rgba(108, 191, 131, 0.14);
        --warn: #e0b45e;
        --warn-soft: rgba(224, 180, 94, 0.14);
        --danger: #e58670;
        --danger-soft: rgba(229, 134, 112, 0.15);
        --info: #7aa9d6;
        --info-soft: rgba(122, 169, 214, 0.15);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 18px 40px -24px rgba(0, 0, 0, 0.75);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        color: var(--ink);
        background-color: var(--bg);
        background-image: radial-gradient(1000px 520px at 8% -10%, var(--bg-g1), transparent 60%),
          radial-gradient(900px 520px at 92% 0%, var(--bg-g2), transparent 62%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        line-height: 1.5;
      }
      ::selection {
        background: var(--accent-soft);
      }
      [hidden] {
        display: none !important;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      a {
        color: var(--accent-2);
      }

      /* ---------- 品牌小图腾 ---------- */
      .fish {
        display: inline-block;
        color: var(--accent);
        line-height: 0;
      }
      .fish svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ============================================================
       * 令牌门
       * ========================================================== */
      .gate {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .gate-card {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        padding: 30px 28px 24px;
      }
      .gate-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .gate-brand .fish {
        width: 42px;
        height: 42px;
        padding: 8px;
        background: var(--accent-soft);
        border-radius: 13px;
      }
      .gate-brand h1 {
        font-size: 17px;
        font-weight: 650;
        margin: 0;
        letter-spacing: 0.01em;
      }
      .gate-brand p {
        margin: 1px 0 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .gate-live {
        margin: 20px 0 22px;
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        border: 1px solid var(--line);
        font-size: 12.5px;
        color: var(--ink-2);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .gate-form label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 7px;
        letter-spacing: 0.02em;
      }
      .gate-input {
        position: relative;
        display: flex;
        gap: 8px;
      }
      .gate-input input {
        flex: 1;
        min-width: 0;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--line-2);
        border-radius: var(--radius-sm);
        padding: 11px 13px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .gate-input input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .gate-eye {
        flex: 0 0 auto;
        border: 1px solid var(--line-2);
        background: var(--surface-2);
        color: var(--muted);
        border-radius: var(--radius-sm);
        padding: 0 13px;
        font-size: 12.5px;
      }
      .gate-eye:hover {
        color: var(--ink);
      }
      .gate-hint {
        font-size: 12px;
        color: var(--muted);
        margin: 14px 0 0;
        min-height: 17px;
        line-height: 1.45;
      }
      .gate-hint.err {
        color: var(--danger);
      }

      /* ---------- 通用按钮 ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--line-2);
        background: var(--surface-2);
        color: var(--ink);
        border-radius: var(--radius-sm);
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 550;
        transition: transform 0.06s, background 0.15s, border-color 0.15s, color 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent-2);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        filter: brightness(1.05);
        color: var(--accent-ink);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: var(--surface-2);
      }
      .btn.danger {
        border-color: transparent;
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn.danger:hover {
        background: var(--danger);
        color: #fff;
      }
      .btn.block {
        width: 100%;
        margin-top: 16px;
        padding: 11px 14px;
      }
      .btn.sm {
        padding: 6px 11px;
        font-size: 12.5px;
        border-radius: 9px;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      /* ============================================================
       * 主框架
       * ========================================================== */
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px clamp(14px, 3vw, 32px) 64px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 2px 14px;
        backdrop-filter: blur(10px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      .brand .fish {
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        padding: 7px;
        background: var(--accent-soft);
        border-radius: 12px;
        color: var(--accent);
      }
      .brand-txt h1 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 660;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .brand-txt p {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.03em;
      }
      .grow {
        flex: 1;
      }
      .live-pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--ok);
        background: var(--ok-soft);
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 5px 11px 5px 9px;
      }
      .live-pill.down {
        color: var(--danger);
        background: var(--danger-soft);
      }
      /* 活着但一直有失败请求：黄，跟"断线"区分开 */
      .live-pill.warn {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex: 0 0 auto;
      }
      .live-pill:not(.down) .dot {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent);
          opacity: 1;
        }
        50% {
          box-shadow: 0 0 0 4px transparent;
          opacity: 0.55;
        }
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink-2);
        transition: color 0.15s, border-color 0.15s, background 0.15s;
      }
      .icon-btn:hover {
        color: var(--accent-2);
        border-color: var(--accent);
      }
      .icon-btn svg {
        width: 17px;
        height: 17px;
      }

      /* ============================================================
       * Hero 状态条
       * ========================================================== */
      .hero {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 58%, var(--accent-soft) 140%);
        box-shadow: var(--shadow-sm);
        padding: 20px 22px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px 26px;
        align-items: center;
      }
      .hero-state {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }
      .hero-orb {
        width: 46px;
        height: 46px;
        flex: 0 0 auto;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .hero-orb svg {
        width: 24px;
        height: 24px;
      }
      .hero.down .hero-orb {
        background: var(--danger-soft);
        color: var(--danger);
      }
      /* 有失败请求但服务还活着：黄，不要用红吓人，也别装作没问题 */
      .hero.warn .hero-orb {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .hero-title {
        font-size: 21px;
        font-weight: 680;
        letter-spacing: 0.01em;
        line-height: 1.15;
      }
      .hero-sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hero-clock {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .clock-time {
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.1;
      }
      .clock-date {
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .hero-chips {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-2);
        background: color-mix(in srgb, var(--surface) 70%, transparent);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 11px;
      }
      .chip b {
        font-weight: 650;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .chip .k {
        color: var(--muted);
      }
      /*
       * 原来这里有个「最近 30 分钟」火花图。删了：
       * 这个服务的流量是稀疏脉冲，30 根 3px 的柱子基本看不出东西，
       * 窄屏还会挤成一根杂线，反而像渲染错误。活跃度看「近一分钟」芯片就够了。
       */

      /* ============================================================
       * 统计磁贴
       * ========================================================== */
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
        margin-top: 14px;
      }
      .stat {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        padding: 14px 15px 13px;
        overflow: hidden;
      }
      .stat::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        bottom: 14px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--tone, var(--accent));
      }
      .stat-label {
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .stat-label i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--tone, var(--accent));
        opacity: 0.75;
      }
      .stat-num {
        margin-top: 7px;
        font-size: 27px;
        font-weight: 660;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .stat-num.mono {
        font-family: var(--mono);
        font-size: 24px;
      }
      .stat-sub {
        margin-top: 5px;
        font-size: 11px;
        color: var(--muted);
        min-height: 14px;
      }

      /* ============================================================
       * 主体两栏
       * ========================================================== */
      .main {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(290px, 1fr);
        gap: 14px;
        margin-top: 14px;
        align-items: start;
      }
      .side {
        display: grid;
        gap: 14px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
      }
      .panel-title {
        font-size: 13.5px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }
      .panel-count {
        font-size: 11.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .panel-body {
        padding: 0 16px 14px;
      }

      /* ---------- 卡片浏览器 ---------- */
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 0 16px 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .search {
        position: relative;
        flex: 1 1 190px;
        min-width: 150px;
      }
      .search svg {
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        width: 15px;
        height: 15px;
        color: var(--muted);
        pointer-events: none;
      }
      .search input {
        width: 100%;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 30px 8px 33px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .search input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .filters {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .fchip {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-2);
        border-radius: 999px;
        padding: 6px 11px;
        font-size: 12.5px;
        font-weight: 500;
        transition: all 0.14s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .fchip b {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-weight: 600;
        font-size: 11.5px;
      }
      .fchip:hover {
        border-color: var(--accent);
        color: var(--accent-2);
      }
      .fchip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .fchip.active b {
        color: color-mix(in srgb, var(--accent-ink) 80%, transparent);
      }

      .card-list {
        display: flex;
        flex-direction: column;
      }
      .crow {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        border-top: 1px solid var(--line);
        padding: 12px 16px;
        color: inherit;
        transition: background 0.12s;
      }
      .crow:first-child {
        border-top: none;
      }
      .crow:hover {
        background: var(--surface-2);
      }
      .crow-bar {
        width: 4px;
        align-self: stretch;
        border-radius: 4px;
        background: var(--muted);
        flex: 0 0 auto;
      }
      .crow-main {
        min-width: 0;
        flex: 1;
      }
      .crow-title {
        font-size: 14px;
        font-weight: 560;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .crow-title .tt {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag {
        flex: 0 0 auto;
        font-size: 10.5px;
        color: var(--ink-2);
        background: var(--surface-3);
        border-radius: 6px;
        padding: 1px 7px;
        letter-spacing: 0.02em;
      }
      .crow-meta {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }
      .crow-meta .sep {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--line-2);
      }
      .crow-right {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        min-width: 74px;
      }
      .prog {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .prog-track {
        width: 52px;
        height: 5px;
        border-radius: 4px;
        background: var(--surface-3);
        overflow: hidden;
      }
      .prog-fill {
        height: 100%;
        border-radius: 4px;
        background: var(--ok);
        transition: width 0.4s;
      }
      .badge {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid transparent;
      }
      .badge.open {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .badge.done {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .badge.archived {
        color: var(--muted);
        background: var(--surface-3);
      }
      .badge.deleted {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .empty {
        padding: 34px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .empty .fish {
        width: 40px;
        height: 40px;
        opacity: 0.35;
        margin-bottom: 8px;
      }

      .crow-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        background: var(--surface-2);
      }
      .pager-info {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .pager {
        display: flex;
        gap: 6px;
      }

      /* ============================================================
       * 实时动态 + 设备
       * ========================================================== */
      .feed {
        display: flex;
        flex-direction: column;
        max-height: 340px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .feed::-webkit-scrollbar {
        width: 7px;
      }
      .feed::-webkit-scrollbar-thumb {
        background: var(--line-2);
        border-radius: 4px;
      }
      .evt {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 9px 2px;
        border-top: 1px solid var(--line);
      }
      .evt:first-child {
        border-top: none;
      }
      .evt-ico {
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 13px;
        line-height: 1;
      }
      .evt-ico.push {
        color: var(--ok);
        background: var(--ok-soft);
      }
      .evt-ico.pull {
        color: var(--info);
        background: var(--info-soft);
      }
      .evt-ico.admin {
        color: var(--warn);
        background: var(--warn-soft);
      }
      .evt-main {
        min-width: 0;
        flex: 1;
      }
      .evt-line {
        font-size: 12.5px;
        color: var(--ink);
        display: flex;
        gap: 6px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .evt-dev {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--accent-2);
        background: var(--accent-soft);
        padding: 0 6px;
        border-radius: 5px;
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        display: inline-block;
        vertical-align: bottom;
      }
      .evt-sub {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .evt-time {
        flex: 0 0 auto;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        padding-top: 1px;
      }

      /* 失败事件：必须一眼能认出来，别让它混在成功里 */
      .evt-ico.fail {
        color: var(--danger);
        background: var(--danger-soft);
      }
      .evt.failed {
        background: color-mix(in srgb, var(--danger-soft) 42%, transparent);
        border-radius: 9px;
      }
      .evt-line .evt-fail-txt {
        color: var(--danger);
        font-weight: 600;
      }

      /* 动态筛选条 */
      .feed-tools {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        padding: 0 0 10px;
      }
      .feed-tools .fchip {
        padding: 4px 9px;
        font-size: 11.5px;
        gap: 4px;
      }
      .feed-tools .fchip b {
        font-size: 10.5px;
      }
      .feed-dev {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--accent-2);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 3px 4px 3px 9px;
        max-width: 190px;
      }
      .feed-dev b {
        font-family: var(--mono);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .feed-dev button {
        border: none;
        background: transparent;
        color: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 50%;
      }
      .feed-dev button:hover {
        background: color-mix(in srgb, var(--accent-2) 18%, transparent);
      }

      .devices {
        display: flex;
        flex-direction: column;
      }
      .dev {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 6px;
        margin: 0 -6px;
        border-top: 1px solid var(--line);
        width: calc(100% + 12px);
        background: transparent;
        border-left: none;
        border-right: none;
        border-bottom: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        border-radius: 9px;
        transition: background 0.12s;
      }
      .dev:first-child {
        border-top: none;
      }
      .dev:hover {
        background: var(--surface-2);
      }
      .dev.active {
        background: var(--accent-soft);
      }
      .dev-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line-2);
        flex: 0 0 auto;
      }
      .dev-dot.on {
        background: var(--ok);
        box-shadow: 0 0 0 3px var(--ok-soft);
      }
      .dev-main {
        min-width: 0;
        flex: 1;
      }
      .dev-name {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dev-meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        font-variant-numeric: tabular-nums;
      }
      .dev-fail {
        color: var(--danger);
        font-weight: 600;
      }
      .dev-plat {
        flex: 0 0 auto;
        font-size: 10px;
        letter-spacing: 0.05em;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 1px 6px;
      }
      .dev-plat.panel {
        color: var(--accent-2);
        border-color: color-mix(in srgb, var(--accent-2) 45%, transparent);
      }

      /* 搜索框清除按钮 */
      .search-clear {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .search-clear:hover {
        color: var(--ink);
        background: var(--surface-3);
      }

      /* ============================================================
       * 抽屉
       * ========================================================== */
      .drawer {
        position: fixed;
        inset: 0;
        z-index: 60;
      }
      .drawer-veil {
        position: absolute;
        inset: 0;
        background: rgba(20, 16, 8, 0.42);
        opacity: 0;
        transition: opacity 0.22s;
        backdrop-filter: blur(1.5px);
      }
      .drawer.open .drawer-veil {
        opacity: 1;
      }
      .drawer-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(460px, 100%);
        background: var(--surface);
        border-left: 1px solid var(--line);
        box-shadow: -20px 0 60px -30px rgba(0, 0, 0, 0.5);
        transform: translateX(100%);
        transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        display: flex;
        flex-direction: column;
      }
      .drawer.open .drawer-panel {
        transform: translateX(0);
      }
      .drawer-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 18px 20px 14px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head .dh-main {
        min-width: 0;
        flex: 1;
      }
      .drawer-head h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 660;
        line-height: 1.3;
        word-break: break-word;
      }
      .drawer-head .dh-sub {
        margin-top: 5px;
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }
      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px 26px;
      }
      .dsec {
        margin-bottom: 20px;
      }
      .dsec > h3 {
        margin: 0 0 10px;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 650;
      }
      .kv {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 8px 12px;
        font-size: 12.5px;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        color: var(--ink);
        word-break: break-all;
      }
      .kv dd.mono {
        font-family: var(--mono);
        font-size: 11.5px;
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .item-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        font-size: 13px;
        padding: 6px 0;
        border-top: 1px dashed var(--line);
      }
      .item-row:first-child {
        border-top: none;
      }
      .item-box {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        border: 1.5px solid var(--line-2);
        flex: 0 0 auto;
        margin-top: 2px;
        display: grid;
        place-items: center;
      }
      .item-box.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .item-box.on svg {
        width: 10px;
        height: 10px;
      }
      .item-row.done .item-text {
        color: var(--muted);
        text-decoration: line-through;
      }
      .json-box {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 12px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.55;
        color: var(--ink-2);
        max-height: 240px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .dact {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      /* ============================================================
       * Toast
       * ========================================================== */
      .toasts {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 90;
        display: flex;
        flex-direction: column;
        gap: 9px;
        align-items: flex-end;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        background: var(--ink);
        color: var(--surface);
        font-size: 13px;
        padding: 10px 15px;
        border-radius: 11px;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(8px) scale(0.98);
        transition: opacity 0.24s, transform 0.24s;
        max-width: 320px;
      }
      .toast.in {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .toast.ok {
        background: var(--ok);
        color: #fff;
      }
      .toast.err {
        background: var(--danger);
        color: #fff;
      }

      .foot {
        margin-top: 26px;
        text-align: center;
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .foot .fish {
        width: 15px;
        height: 15px;
        vertical-align: -3px;
        color: var(--accent);
        opacity: 0.8;
        margin: 0 3px;
      }

      /* ============================================================
       * 响应式
       * ========================================================== */
      @media (max-width: 1060px) {
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
        .main {
          grid-template-columns: 1fr;
        }
        .side {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 680px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .side {
          grid-template-columns: 1fr;
        }
        .hero {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .hero-clock {
          text-align: left;
          display: flex;
          align-items: baseline;
          gap: 10px;
        }
        .clock-time {
          font-size: 20px;
        }
        .brand-txt h1 {
          font-size: 14px;
        }
        .live-pill .lp-text {
          display: none;
        }
        .crow-right {
          min-width: 58px;
        }
        .crow-title .tag {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===================== 令牌门 ===================== -->
    <div id="gate" class="gate">
      <div class="gate-card">
        <div class="gate-brand">
          <span class="fish" id="gate-fish"></span>
          <div>
            <h1>挂卡时间轴</h1>
            <p>同步服务 · 控制台</p>
          </div>
        </div>
        <div class="gate-live" id="gate-live">
          <span class="dot" style="background: var(--muted)"></span>
          <span>正在探测服务器…</span>
        </div>
        <form class="gate-form" id="gate-form" autocomplete="off">
          <label for="gate-token">访问令牌</label>
          <div class="gate-input">
            <input id="gate-token" type="password" placeholder="粘贴服务器令牌…" spellcheck="false" />
            <button type="button" class="gate-eye" id="gate-eye">显示</button>
          </div>
          <button type="submit" class="btn primary block" id="gate-submit">进入控制台</button>
        </form>
        <p class="gate-hint" id="gate-hint">令牌只保存在这台设备的浏览器里。</p>
      </div>
    </div>

    <!-- ===================== 主应用 ===================== -->
    <div id="app" class="shell" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="fish" id="top-fish"></span>
          <div class="brand-txt">
            <h1>挂卡时间轴</h1>
            <p>同步服务控制台</p>
          </div>
        </div>
        <div class="grow"></div>
        <span class="live-pill" id="live-pill">
          <span class="dot"></span><span class="lp-text">LIVE</span>
        </span>
        <button class="icon-btn" id="btn-theme" title="切换深/浅色" aria-label="切换主题"></button>
        <button class="icon-btn" id="btn-logout" title="退出（清除本机令牌）" aria-label="退出"></button>
      </header>

      <section class="hero" id="hero">
        <div class="hero-state">
          <div class="hero-orb" id="hero-orb"></div>
          <div style="min-width: 0">
            <div class="hero-title" id="hero-title">运行正常</div>
            <div class="hero-sub" id="hero-sub">正在读取服务状态…</div>
          </div>
        </div>
        <div class="hero-clock">
          <div class="clock-time" id="clock">--:--:--</div>
          <div class="clock-date" id="clock-date"></div>
        </div>
        <div class="hero-chips" id="hero-chips"></div>
      </section>

      <section class="stats" id="stats"></section>

      <div class="main">
        <section class="panel">
          <div class="panel-head">
            <span class="panel-title">卡片</span>
            <span class="panel-count" id="cards-count"></span>
            <div class="grow"></div>
            <button class="btn sm ghost" id="btn-refresh" title="刷新">刷新</button>
          </div>
          <div class="toolbar">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <input id="search" type="search" placeholder="搜索标题…" aria-label="搜索卡片标题" />
              <button class="search-clear" id="search-clear" type="button" hidden aria-label="清空搜索">✕</button>
            </div>
            <div class="filters" id="filters"></div>
          </div>
          <div class="card-list" id="card-list"></div>
          <div class="crow-foot">
            <span class="pager-info" id="pager-info"></span>
            <div class="pager">
              <button class="btn sm" id="prev" title="上一页">上一页</button>
              <button class="btn sm" id="next" title="下一页">下一页</button>
            </div>
          </div>
        </section>

        <aside class="side">
          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">实时动态</span>
              <div class="grow"></div>
              <span class="panel-count" id="feed-count"></span>
            </div>
            <div class="panel-body">
              <div class="feed-tools" id="feed-tools"></div>
              <div class="feed" id="feed" aria-live="polite" aria-relevant="additions"></div>

          <section class="panel">

      <footer class="foot">
        <span id="foot-version">挂卡时间轴同步服务</span> · <span class="fish" id="foot-fish"></span> 用 SQLite 喂饱 · <a href="/api/admin/export" id="export-link">导出全部</a>
      </footer>

    <!-- ===================== 抽屉 ===================== -->
    <div id="drawer" class="drawer" hidden>
      <div class="drawer-veil" data-close="1"></div>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dt-title" id="dt-panel">
        <div class="drawer-head">
          <div class="dh-main">
            <h2 id="dt-title">卡片</h2>

          </div>

              <path d="M6 6l12 12M18 6L6 18"></path>
