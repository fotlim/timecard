#:schema node_modules/wrangler/config-schema.json
name = "timecard-sync"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库。先 `wrangler d1 create timecard` 再把返回的 id 填这里
[[d1_databases]]
binding = "DB"
database_name = "timecard"
database_id = "在这里填 wrangler d1 create 返回的 id"

[observability]
enabled = true
